<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能客服</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --primary: #4f6ef7;
      --primary-hover: #3b5ce4;
      --user-bubble: #4f6ef7;
      --bot-bubble: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      height: 96vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    .header {
      padding: 16px 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: .85; }

    /* ---------- Messages ---------- */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 85%;
      animation: fadeUp .25s ease-out;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .msg.bot .avatar  { background: #eef2ff; color: var(--primary); }
    .msg.user .avatar { background: var(--primary); color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .sources span {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex; gap: 4px; padding: 4px 0;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-secondary);
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 60%, 100% { opacity: .3; }
      30% { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Input ---------- */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .input-area input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .input-area input:focus { border-color: var(--primary); }
    .input-area input::placeholder { color: #9ca3af; }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }

    /* ---------- Welcome ---------- */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .welcome-icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 13px; line-height: 1.6; }

    .quick-questions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .quick-btn {
      background: #eef2ff;
      border: 1px solid #dbeafe;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .quick-btn:hover { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">🤖</div>
      <div class="header-info">
        <h1>智能客服助手</h1>
        <p>有问题随时问我</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" ref="messagesRef">
      <!-- Welcome -->
      <div v-if="messages.length === 0" class="welcome">
        <div class="welcome-icon">💬</div>
        <h2>你好！我是智能客服</h2>
        <p>我可以回答关于产品和服务的常见问题<br/>请输入您的问题，我会尽力帮助您</p>
        <div class="quick-questions">
          <button class="quick-btn" v-for="q in quickQuestions" :key="q" @click="sendQuick(q)">
            {{ q }}
          </button>
        </div>
      </div>

      <!-- Chat messages -->
      <div v-for="(msg, i) in messages" :key="i"
           class="msg" :class="msg.role">
        <div class="avatar">{{ msg.role === 'user' ? '🧑' : '🤖' }}</div>
        <div>
          <div class="bubble">{{ msg.content }}</div>
          <div v-if="msg.sources && msg.sources.length" class="sources">
            📎 <span v-for="s in msg.sources" :key="s">{{ s }}</span>
          </div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div v-if="loading" class="msg bot">
        <div class="avatar">🤖</div>
        <div class="bubble">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <input
        v-model="input"
        @keyup.enter="send"
        placeholder="输入您的问题..."
        :disabled="loading"
      />
      <button class="send-btn" @click="send" :disabled="loading || !input.trim()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
