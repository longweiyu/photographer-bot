<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能客服</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="preload" href="/static/avatar_user.jpg" as="image" />
  <link rel="preload" href="/static/avatar_bot.png" as="image" />
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-bg-strong: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --glass-blur: 24px;
      --glass-inner-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6);

      --user-bubble-bg: rgba(90, 130, 240, 0.55);
      --user-bubble-border: rgba(120, 160, 255, 0.4);
      --bot-bubble-bg: rgba(255, 255, 255, 0.5);
      --bot-bubble-border: rgba(255, 255, 255, 0.6);

      --text: #1a1a2e;
      --text-light: #5a5a7a;
      --text-on-blue: #ffffff;
      --accent: #5a82f0;
      --accent-hover: #4a6fd8;

      --radius: 20px;
      --radius-sm: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      /* 液态玻璃背景 —— 多层柔和渐变模拟 Apple 风格 */
      background:
        radial-gradient(ellipse at 20% 20%, rgba(162, 200, 255, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(200, 170, 255, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(140, 220, 255, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(255, 190, 220, 0.3) 0%, transparent 40%),
        linear-gradient(135deg, #e8eef8 0%, #f0eaf6 30%, #eaf4fb 60%, #f5f0fa 100%);
      background-attachment: fixed;
    }

    /* 流动光效动画 */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 30% 40%, rgba(120, 180, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(180, 140, 255, 0.12) 0%, transparent 40%);
      animation: floatGlow 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatGlow {
      0%   { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, -20px) rotate(3deg); }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      height: 94vh;
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      overflow: hidden;

      /* 液态玻璃主容器 */
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
      border: 1px solid var(--glass-border);
      box-shadow:
        var(--glass-shadow),
        var(--glass-inner-shadow),
        0 0 0 0.5px rgba(255,255,255,0.3);
    }

    /* ========== Header ========== */
    .header {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;

      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
    }

    .header-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 2px 12px rgba(90, 130, 240, 0.2);
    }

    .header-info h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .header-info p {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 400;
    }
    .header-status {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4cd964;
      margin-right: 4px;
      vertical-align: middle;
      box-shadow: 0 0 6px rgba(76, 217, 100, 0.5);
    }

    /* ========== Messages ========== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
    }

    /* 消息行 */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 82%;
      animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 头像 */
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 气泡 —— 液态玻璃 */
    .bubble {
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 400;
    }

    .msg.bot .bubble {
      background: var(--bot-bubble-bg);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border: 1px solid var(--bot-bubble-border);
      box-shadow:
        0 2px 12px rgba(0,0,0,0.04),
        inset 0 1px 1px rgba(255,255,255,0.5);
      border-bottom-left-radius: 6px;
      color: var(--text);
    }

    .msg.user .bubble {
      background: var(--user-bubble-bg);
      backdrop-filter: blur(16px) saturate(1.5);
      -webkit-backdrop-filter: blur(16px) saturate(1.5);
      border: 1px solid var(--user-bubble-border);
      box-shadow:
        0 4px 16px rgba(90, 130, 240, 0.18),
        inset 0 1px 1px rgba(255,255,255,0.25);
      border-bottom-right-radius: 6px;
      color: var(--text-on-blue);
    }

    /* 来源标签 */
    .sources {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-light);
    }
    .sources span {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2px 8px;
      border-radius: 8px;
      margin-right: 4px;
      border: 1px solid rgba(255,255,255,0.4);
      font-weight: 500;
    }

    /* 打字动画 */
    .typing-dots {
      display: flex; gap: 5px; padding: 6px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: pulse 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.25; transform: scale(1); }
      30% { opacity: 0.9; transform: scale(1.2); }
    }

    /* ========== Welcome ========== */
    .welcome {
      text-align: center;
      padding: 36px 20px;
    }
    .welcome-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      border: 2.5px solid rgba(255,255,255,0.6);
      box-shadow: 0 4px 24px rgba(90,130,240,0.15);
    }
    .welcome h2 {
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .welcome p {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-light);
      font-weight: 300;
    }

    .quick-questions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 18px;
    }
    .quick-btn {
      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04), inset 0 1px 1px rgba(255,255,255,0.4);
    }
    .quick-btn:hover {
      background: var(--user-bubble-bg);
      color: #fff;
      border-color: var(--user-bubble-border);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(90,130,240,0.2);
    }

    /* ========== Input ========== */
    .input-area {
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;

      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-top: 1px solid rgba(255,255,255,0.4);
    }

    .input-area input {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      padding: 11px 18px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      font-weight: 400;
      color: var(--text);

      background: rgba(255,255,255,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03), 0 1px 1px rgba(255,255,255,0.5);
      transition: all 0.25s ease;
    }
    .input-area input:focus {
      border-color: rgba(90, 130, 240, 0.4);
      background: rgba(255,255,255,0.6);
      box-shadow: 0 0 0 3px rgba(90,130,240,0.1), inset 0 1px 2px rgba(0,0,0,0.02);
    }
    .input-area input::placeholder { color: #9a9abb; font-weight: 300; }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid var(--user-bubble-border);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;

      background: var(--user-bubble-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 14px rgba(90,130,240,0.2), inset 0 1px 1px rgba(255,255,255,0.2);
      color: #fff;
    }
    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(90,130,240,0.3), inset 0 1px 1px rgba(255,255,255,0.25);
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <img class="header-avatar" src="/static/avatar_bot.png" alt="bot" />
      <div class="header-info">
        <h1>智能客服助手</h1>
        <p><span class="header-status"></span>在线 · 随时为您服务</p>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" ref="messagesRef">
      <!-- Welcome -->
      <div v-if="messages.length === 0" class="welcome">
        <img class="welcome-avatar" src="/static/avatar_bot.png" alt="bot" />
        <h2>你好！我是智能客服</h2>
        <p>我可以回答关于产品和服务的常见问题<br/>请输入您的问题，我会尽力帮助您</p>
        <div class="quick-questions">
          <button class="quick-btn" v-for="q in quickQuestions" :key="q" @click="sendQuick(q)">
            {{ q }}
          </button>
        </div>
      </div>

      <!-- Chat messages -->
      <div v-for="(msg, i) in messages" :key="i" class="msg" :class="msg.role">
        <img class="avatar"
             :src="msg.role === 'user' ? '/static/avatar_user.jpg' : '/static/avatar_bot.png'"
             :alt="msg.role" />
        <div>
          <div class="bubble">{{ msg.content }}</div>
          <div v-if="false && msg.sources && msg.sources.length" class="sources">
            📎 <span v-for="s in msg.sources" :key="s">{{ s }}</span>
          </div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div v-if="loading" class="msg bot">
        <img class="avatar" src="/static/avatar_bot.png" alt="bot" />
        <div class="bubble">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>

    <div style="text-align:center;padding:4px 0;font-size:11px;color:#9a9abb;font-weight:300;flex-shrink:0;">
      详细问题可加微信：lovetange77
    </div>

    <!-- Input -->
    <div class="input-area">
      <input
        v-model="input"
        @keyup.enter="send"
        placeholder="输入您的问题..."
        :disabled="loading"
      />
      <button class="send-btn" @click="send" :disabled="loading || !input.trim()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
